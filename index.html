<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Література · 5 клас — уроки-квести</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Manrope:wght@400;700&display=swap">
<style>
body{margin:0;min-height:100vh;background:#12101a;color:#f4f1f9;font:17px/1.6 Manrope,system-ui,sans-serif;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(157,107,219,.25),transparent 70%)}
.w{max-width:720px;margin:0 auto;padding:28px 18px 60px;display:grid;gap:18px}
img.logo{width:160px;height:auto}
h1{font:800 clamp(26px,6vw,40px)/1.15 Unbounded,system-ui,sans-serif;margin:0}
p{margin:0;color:#b9b0cc}
a.card{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;text-decoration:none;color:inherit;background:#211b30;border:1px solid #332d44;border-radius:18px;padding:12px;transition:border-color .2s,transform .2s}
a.card:hover{border-color:#f7c915;transform:translateY(-2px)}
a.card img{width:96px;height:72px;object-fit:cover;border-radius:12px}
a.card b{font-size:18px;display:block}
a.card span{font-size:14px;color:#b9b0cc}
</style>
</head>
<body>
<div class="w">
  <img class="logo" src="assets/logo-wordmark.png" alt="Midgard">
  <h1>Література · 5 клас</h1>
  <p>Уроки-квести: читання, завдання, робота в парах і таємниці. Результати потрапляють у таблицю вчителя.</p>
  <a class="card" href="zolote-yabluko/"><img src="zolote-yabluko/img/garden.jpg" alt=""><div><b>Золоте яблуко</b><span>Кримськотатарська народна казка · 100 балів · 7 скарбів</span></div></a>
</div>
</body>
</html>
