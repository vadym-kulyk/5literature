<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Справа братів Ґрімм — детективне розслідування</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;700;800&family=Alegreya:ital,wght@0,400;0,700;1,400&family=Marck+Script&family=Special+Elite&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: детективна дошка — 8 запечатаних конвертів-доказів сіткою, нижче досьє з 4 завданнями; зверху лого, рахунок, кількість розкритих доказів. */
:root{color-scheme:dark;--night:#12101a;--sky:#1b1826;--page:#211b30;--line:#332d44;--ink:#f4f1f9;--muted:#b9b0cc;
  --lime:#99cc00;--violet:#9d6bdb;--gold:#f7c915;--right:#a5d914;--wrong:#ff7a5e;
  --paper:#efe4cc;--paper2:#e3d3b0;--pink:#2b2230;--stamp:#b8322a;
  --f-display:'Unbounded',system-ui,sans-serif;--f-text:'Manrope',system-ui,sans-serif;--f-tale:'Alegreya',Georgia,serif;
  --f-hand:'Marck Script',cursive;--f-type:'Special Elite','Courier New',monospace;--f-mono:'JetBrains Mono',ui-monospace,monospace;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--night)}
body{margin:0;color:var(--ink);font-family:var(--f-text);font-size:17px;line-height:1.6;min-height:100vh;overflow-x:hidden;
  background:var(--night) radial-gradient(1000px 560px at 90% -10%,color-mix(in srgb,var(--violet) 22%,transparent),transparent 70%) fixed}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--sky) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:980px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.mg-logo{width:clamp(132px,22vw,160px);height:auto;display:block}
.sp{flex:1}
.pill{font-family:var(--f-mono);font-weight:700;font-size:14px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--night);white-space:nowrap}
.pill.sc{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.pill.ev{color:var(--violet)}
.pill.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.2)}}
.bar{height:4px;background:var(--line)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--gold));transition:width .8s}
main{max-width:980px;margin:0 auto;padding:22px 14px 90px;display:grid;gap:26px;position:relative}
.mg-mark{position:fixed;pointer-events:none;opacity:.08;z-index:0;width:380px}
.mg-mark--r{right:-230px;top:120px}
@media (max-width:900px){.mg-mark{width:60%;right:-30%;top:60px}}
section{position:relative;z-index:1}
.eyebrow{font-family:var(--f-hand);color:var(--gold);font-size:26px;line-height:1}
.h1{font-size:clamp(28px,7vw,52px);font-weight:800}
.h1 .g{color:var(--gold)}
.h2{font-size:clamp(21px,4.6vw,30px);font-weight:800}
.lead{color:var(--muted);margin:0;max-width:62ch}
.kicker{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.kicker .pts{margin-left:auto;color:var(--gold);letter-spacing:0}
.card{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,4vw,24px);display:grid;gap:14px}
.card.gold{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--lime);color:#1e1b26;border:0;border-radius:999px;padding:12px 22px;font-weight:800;min-height:48px;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:default}
.btn--ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn--gold{background:var(--gold)}
.chip{background:var(--sky);border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;font-size:15px;font-weight:600;min-height:44px;text-align:left}
.chip.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,var(--sky))}
.chip.ok{border-color:var(--right)!important;background:color-mix(in srgb,var(--right) 16%,var(--sky))!important}
.chip.no{border-color:var(--wrong)!important;background:color-mix(in srgb,var(--wrong) 14%,var(--sky))!important}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{margin:0;font-size:15px;padding:10px 14px;border-radius:12px;background:var(--sky);border:1px solid var(--line)}
.fb.ok{border-color:color-mix(in srgb,var(--right) 60%,transparent);color:var(--right)}
.fb.no{border-color:color-mix(in srgb,var(--wrong) 55%,transparent);color:#ffb3a3}
.fb:empty{display:none}
input[type=text]{width:100%;background:var(--sky);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
label.f{display:grid;gap:6px;font-weight:700;font-size:15px}
.small{font-size:14px;color:var(--muted);margin:0}
.done{display:inline-flex;font-family:var(--f-mono);font-size:12px;font-weight:700;color:#1e1b26;background:var(--right);border-radius:999px;padding:3px 9px}

/* case folder hero */
.folder{position:relative;background:linear-gradient(160deg,#c9a66b,#a8834a);border-radius:6px 18px 18px 18px;padding:26px 22px 22px;color:#2a1d0e;box-shadow:0 20px 50px rgba(0,0,0,.45);margin-top:52px}
.folder::before{content:"";position:absolute;left:0;top:-18px;width:42%;height:22px;background:#c9a66b;border-radius:10px 14px 0 0}
.folder .lbl{font-family:var(--f-type);font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.folder h2{font-family:var(--f-type);font-size:clamp(24px,6vw,40px);font-weight:400;color:#2a1d0e;margin:6px 0}
.folder p{margin:0;font-family:var(--f-tale);font-size:18px;max-width:60ch}
.stamp{display:inline-block;font-family:var(--f-type);color:var(--stamp);border:3px solid var(--stamp);border-radius:6px;padding:2px 10px;transform:rotate(-8deg);letter-spacing:.1em;font-size:18px;opacity:.85;mix-blend-mode:multiply}
.folder .stamp{position:absolute;right:12px;top:-46px;background:var(--night)}

/* evidence board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.env{position:relative;aspect-ratio:4/3;border:0;border-radius:10px;background:linear-gradient(170deg,var(--paper),var(--paper2));color:#2a1d0e;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(0,0,0,.4);transition:transform .25s;overflow:hidden}
.env:nth-child(odd){transform:rotate(-1.5deg)}.env:nth-child(even){transform:rotate(1.2deg)}
.env:hover{transform:rotate(0) translateY(-4px)}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(155deg,transparent 49.5%,rgba(0,0,0,.08) 50%,transparent 51%),linear-gradient(25deg,transparent 49.5%,rgba(0,0,0,.08) 50%,transparent 51%);pointer-events:none}
.env .no{font-family:var(--f-type);font-size:12px;letter-spacing:.1em}
.env .tt{font-family:var(--f-type);font-size:16px;line-height:1.2}
.env .seal{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e05a4a,#8e1f17);box-shadow:0 2px 4px rgba(0,0,0,.35);display:grid;place-items:center;color:#f7d6c8;font-family:var(--f-display);font-weight:800;font-size:13px}
.env.open .seal{display:none}
.env .st{position:absolute;right:8px;bottom:12px;font-size:13px;display:none}
.env.open .st{display:inline-block}
.env.cur{outline:3px solid var(--gold);outline-offset:3px}

/* opened evidence */
.evi{background:linear-gradient(170deg,var(--paper),var(--paper2));color:#2a1d0e;border-radius:14px;padding:clamp(16px,4vw,26px);display:grid;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,.45);position:relative;animation:unfold .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes unfold{from{opacity:0;transform:translateY(16px) rotate(-1deg) scale(.97)}to{opacity:1;transform:none}}
.evi .no{font-family:var(--f-type);font-size:13px;letter-spacing:.12em;opacity:.7}
.evi h3{font-family:var(--f-type);font-weight:400;font-size:clamp(20px,5vw,28px);color:#2a1d0e}
.evi .doc{font-family:var(--f-tale);font-size:clamp(17px,2.3vw,19px);line-height:1.65;margin:0}
.evi .doc b{background:linear-gradient(transparent 60%,rgba(247,201,21,.55) 60%)}
.evi .facts{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-family:var(--f-type);font-size:15px}
.evi .facts li::before{content:"▸ ";color:var(--stamp)}
.evi .lock{border-top:2px dashed rgba(42,29,14,.3);padding-top:12px;display:grid;gap:10px}
.evi .lock p{margin:0;font-weight:800;font-family:var(--f-text)}
.evi .chip{background:#fff8e8;border-color:#cdb68a;color:#2a1d0e}
.evi .chip.ok{background:#dcefc0!important;border-color:#3f7a16!important}
.evi .chip.no{background:#f6d2c8!important;border-color:#c13f2c!important}
.evi .fb{background:#fff8e8;border-color:#cdb68a;color:#2a1d0e}
.evi .fb.ok{color:#3f7a16;border-color:#3f7a16}.evi .fb.no{color:#c13f2c;border-color:#c13f2c}
.evi .stamp{position:absolute;right:14px;top:14px}
.evi .clue{font-family:var(--f-hand);font-size:22px;color:#6b3a8a;margin:0}
.print{position:absolute;z-index:3;width:40px;height:40px;border:0;background:none;padding:0;opacity:.35;transition:opacity .3s,transform .3s}
.print:hover{opacity:.8;transform:scale(1.15)}
.print.got{animation:fly .8s forwards;pointer-events:none}
@keyframes fly{40%{transform:scale(1.8);opacity:1}100%{transform:translateY(-90px) scale(.3);opacity:0}}

/* dossier tasks */
.slots{display:grid;gap:8px;counter-reset:s}
.slot{display:flex;align-items:center;gap:10px;min-height:50px;border:1.5px dashed var(--line);border-radius:14px;padding:8px 12px}
.slot .yr{font-family:var(--f-mono);font-weight:700;color:var(--gold);min-width:46px}
.slot.filled{border-style:solid;border-color:var(--violet);background:var(--sky);cursor:pointer;animation:unfold .3s both}
.slot.ok{border-color:var(--right)}.slot.no{border-color:var(--wrong)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .chip{border-radius:12px}
.it{display:grid;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--sky)}
.it p{margin:0}.it.ok{border-color:var(--right)}.it.no{border-color:var(--wrong)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:10px}
.witness{font-family:var(--f-tale);font-style:italic;font-size:18px;background:var(--sky);border-left:4px solid var(--violet);border-radius:0 14px 14px 0;padding:12px 16px;margin:0}
.who{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.who b{color:var(--gold)}
/* final */
.cert{text-align:center;justify-items:center}
.cert .big{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,14vw,80px);color:var(--gold);line-height:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;width:min(440px,calc(100% - 28px));background:var(--sky);border:1px solid var(--gold);border-radius:16px;padding:12px 16px;box-shadow:0 14px 36px rgba(0,0,0,.6);display:flex;gap:12px;animation:toast .45s both}
.toast .big{font-size:24px;line-height:1}
.toast b{color:var(--gold)}
@keyframes toast{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
#fx{position:fixed;inset:0;z-index:80;pointer-events:none}
.secret{background:linear-gradient(170deg,#3a2f12,#1f1a0c);border:1px solid var(--gold);border-radius:14px;padding:16px;display:grid;gap:8px;animation:unfold .6s both}
.secret b{color:var(--gold)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const shuffle=(a,seed)=>{a=a.slice();let x=seed||7;for(let i=a.length-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function hero(){return `<section style="display:grid;gap:14px">

function board(){return `<section style="display:grid;gap:14px">

function evi(i){const e=EVID[i],d=S.done[e.id]!=null;
  const pr=i===3?PRINT('p2','right:12px;top:46%'):i===6?PRINT('p3','right:14px;top:62px'):'';

const head=(id,title,how)=>{const t=TASKS.find(x=>x.id===id),d=S.done[id]!=null;return `<div class="kicker">${id==='wit'?'Робота в парі':'Досьє'}<span class="pts">${d?'<span class="done">✓ +'+t.pts+'</span>':'+'+t.pts+' балів'}</span></div><h2 class="h2">${title}</h2><p class="small" style="font-size:16px">${how}</p>`};
const chk=id=>`<div class="row"><button class="btn" data-check="${id}" ${S.done[id]!=null?'disabled':''}>${S.done[id]!=null?'Виконано ✓':'Перевірити'}</button></div><p class="fb${S.done[id]!=null?' ok':''}" id="fb-${id}">${S.done[id]!=null?'Усе правильно!':''}</p>`;
let tPick=[],whoA={},factA={},witA={};

}
function wire(){
  $('#nm').oninput=e=>{S.name=e.target.value.trim();save()};$('#pt').oninput=e=>{S.partner=e.target.value.trim();save()};
  $('#clsSeg').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.cls=b.dataset.c;save();$('#clsSeg').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))});
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{if(SHEET_URL&&(!S.cls||!S.name)){const h=$('#hint');h.style.color='var(--wrong)';h.textContent=!S.cls?'Спершу обери клас.':'Спершу впиши своє ім\'я.';h.scrollIntoView({behavior:'smooth',block:'center'});return}S.open=+b.dataset.e;save();render('evi')});
  const box=$('#eviBox');if(box&&S.open!=null){const e=EVID[S.open];
    box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,f=box.querySelector('.fb');
      if(k===e.a){award(e.id,5);hud('#evP');render('evi')}else{b.classList.add('no','shake');b.disabled=true;f.className='fb no';f.textContent='Ні. Перечитай доказ ще раз — відповідь там!'}});
    box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.open=+b.dataset.go;save();render('evi')});}
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.p;if(S.prints.includes(id))return;S.prints.push(id);save();b.classList.add('got');sparkle(b);
    toast('🔎',`Відбиток пальця <b>${S.prints.length}/3</b>!${S.prints.length===3?' Секретний документ відкрито — дивись у звіті детектива.':' Шукай далі на доказах.'}`);if(S.prints.length===3)setTimeout(()=>render(),1200)});
  drawTime();
  seg('who',whoA,v=>v,WHO.map(w=>w.a));
  seg('fact',factA,v=>v==='1',FACT.map(f=>f.a),FACT);
  seg('wit',witA,v=>v,WIT.map(w=>w.a));
  const sb=$('#send');if(sb)sb.onclick=()=>syncNow(true);
  let arm=false;$('#reset').onclick=e=>{const b=e.target;if(!arm){arm=true;b.textContent='Точно? Торкнись ще раз';setTimeout(()=>{arm=false;b.textContent='Почати спочатку'},4000);return}
    try{localStorage.removeItem(KEY)}catch(x){}S={name:'',partner:'',cls:'',done:{},prints:[],open:null,sent:0};tPick=[];whoA={};factA={};witA={};render();scrollTo({top:0,behavior:'smooth'})};
}
function seg(id,store,map,ans,src){
  const done=S.done[id]!=null;
  document.querySelectorAll(`#${id} .it`).forEach(it=>{const i=+it.dataset.i;
    if(done){it.classList.add('ok');it.querySelectorAll('.chip').forEach(c=>c.disabled=true);return}
    it.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{it.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');store[i]=map(c.dataset.v);it.classList.remove('no','ok')})});
  if(done)return;
  onCheck(id,()=>{let ok=0;document.querySelectorAll(`#${id} .it`).forEach(it=>{const i=+it.dataset.i;it.classList.remove('ok','no');const w=it.querySelector('.why');if(w)w.textContent='';
    if(store[i]===ans[i]){ok++;it.classList.add('ok');it.querySelectorAll('.chip').forEach(c=>c.disabled=true);if(w&&src&&src[i].why)w.textContent=src[i].why}else if(store[i]!=null)it.classList.add('no','shake')});return [ok,ans.length]});
}
function onCheck(id,fn){const b=document.querySelector(`[data-check="${id}"]`);if(!b)return;
  b.onclick=()=>{const [ok,n]=fn(),f=$('#fb-'+id),t=TASKS.find(x=>x.id===id);
    if(ok===n){f.className='fb ok';f.textContent=`Чудово! ${ok}/${n}. +${t.pts} балів.`;b.disabled=true;b.textContent='Виконано ✓';award(id,t.pts)}
    else{f.className='fb no';f.textContent=`Правильно ${ok} з ${n}. Виправ позначене червоним і перевір ще раз.`}}}
function drawTime(){
  const done=S.done.time!=null,slots=$('#slots'),pool=$('#pool');
  slots.innerHTML=TIMELINE.map((_,i)=>{const p=tPick[i];return p!=null?`<div class="slot filled${done?' ok':''}" data-s="${i}"><span class="yr">${done?TIMELINE[p][0]:'№'+(i+1)}</span>${TIMELINE[p][1]}</div>`:`<div class="slot"><span class="yr">№${i+1}</span></div>`}).join('');
  pool.innerHTML=shuffle(TIMELINE.map((_,i)=>i),13).filter(i=>!tPick.includes(i)).map(i=>`<button class="chip" data-t="${i}">${TIMELINE[i][1]}</button>`).join('');
  if(done)return;
  pool.querySelectorAll('[data-t]').forEach(c=>c.onclick=()=>{tPick.push(+c.dataset.t);drawTime()});
  slots.querySelectorAll('.slot.filled').forEach(s=>s.onclick=()=>{tPick.splice(+s.dataset.s,1);drawTime()});
  onCheck('time',()=>{let ok=0;const els=slots.querySelectorAll('.slot');tPick.forEach((p,i)=>{if(p===i){ok++;els[i].classList.add('ok')}else els[i].classList.add('no','shake')});return [ok,TIMELINE.length]});
}

/* ---------- results → teacher's sheet «5 lit» ---------- */
function payload(){return {lesson:'grimm-bio',title:'Брати Ґрімм: біографія (детективна справа)',cls:S.cls,name:(S.name||'').trim(),partner:(S.partner||'').trim(),score:score(),
  tasks:TASKS.map(t=>({t:t.t,p:S.done[t.id]||0,max:t.pts})),treasures:0,riddles:0,secret:S.prints.length===3,texts:[]}}
function syncSoon(){if(!SHEET_URL||!(S.name||'').trim()||!S.cls)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),8000)}
async function syncNow(manual){if(!SHEET_URL)return;clearTimeout(syncT);
  if(!(S.name||'').trim()||!S.cls){if(manual)toast('✏️','Спочатку обери клас і впиши ім\'я в посвідченні детектива.');return}
  const body=JSON.stringify(payload());if(!manual&&body===lastSig)return;
  try{await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});lastSig=body;S.sent=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    syncMsg='Надіслано вчителю о '+new Date(S.sent).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})+'.';if(manual)toast('📤','Звіт надіслано вчителю!')}
  catch(e){syncMsg='Немає зв\'язку. Перевір інтернет і натисни «Надіслати вчителю» ще раз.';if(manual)toast('⚠️','Не вдалося надіслати.')}
  const m=document.getElementById('syncMsg');if(m)m.textContent=syncMsg}
addEventListener('visibilitychange',()=>{if(document.visibilityState!=='hidden'||!SHEET_URL||!(S.name||'').trim()||!S.cls)return;const body=JSON.stringify(payload());if(body===lastSig)return;try{if(navigator.sendBeacon(SHEET_URL,new Blob([body],{type:'text/plain;charset=utf-8'}))){lastSig=body;S.sent=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}}catch(e){}});

/* ---------- effects ---------- */
let toastT;function toast(b,h){document.querySelectorAll('.toast').forEach(t=>t.remove());clearTimeout(toastT);const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=`<span class="big">${b}</span><div>${h}</div>`;t.onclick=()=>t.remove();document.body.appendChild(t);toastT=setTimeout(()=>t.remove(),4200)}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fx=$('#fx'),fc=fx.getContext('2d');let parts=[],run=false;
function fxs(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px'}fxs();addEventListener('resize',fxs);
function loop(){fc.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.l>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r2+=p.vr;p.l--;fc.save();fc.globalAlpha=Math.min(1,p.l/30);fc.translate(p.x,p.y);fc.rotate(p.r2);fc.fillStyle=p.c;fc.fillRect(-p.r/2,-p.r/3,p.r,p.r/1.5);fc.restore()}if(parts.length)requestAnimationFrame(loop);else run=false}
function emit(x,y,n,sp,up){if(reduce)return;const d=devicePixelRatio,cols=['#f7c915','#99cc00','#9d6bdb','#efe4cc','#b8322a'];for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(Math.random()*sp+2)*d;parts.push({x:x*d,y:y*d,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(up||0)*d,g:.12*d,r:(Math.random()*8+4)*d,c:cols[i%5],r2:Math.random()*6,vr:(Math.random()-.5)*.3,l:60+Math.random()*50})}if(!run){run=true;loop()}}
function sparkle(el){const r=el.getBoundingClientRect();emit(r.left+r.width/2,r.top+r.height/2,30,6)}
function burst(){emit(innerWidth/2,innerHeight*.35,60,8,3)}
function big(){[0,250,500].forEach((t,i)=>setTimeout(()=>emit(innerWidth*(.25+.25*i),innerHeight*.3,60,9,4),t))}
render();
</script>
